[project]
name = "svaram"
version = "0.1.0"
description = "AI-based fake identity and document screening system (SIH26188)"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py39"
exclude = [".venv", "var", "frontend", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is the documented pattern
    "UP006",   # typing.List etc are required for Python 3.9 compatibility
    "UP007",
    "UP035",
    "UP045",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]
