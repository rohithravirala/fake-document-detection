# CI on every push and pull request.
#
# The backend job installs only `requirements.txt` — no models, no ~1 GB of
# wheels. Every decisive check in this system (Aadhaar signature verification,
# PAN structure, MRZ check digits, the verdict engine, the audit chain) runs
# without them, so CI stays under a minute and still covers what matters.
#
# The Python matrix is not decoration: the code is written to run on 3.9 because
# that is what a teammate's system Python may be, while the container uses 3.11.
# Both are tested so neither can drift.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Evaluation harness
        # --strict fails the build on any sample that misses its expected
        # verdict or its expected checks. A false clear fails it regardless.
        run: python evaluation/run.py --strict --json var/evaluation.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python }}
          path: var/evaluation.json
          if-no-files-found: ignore

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Upgrade a fresh database to head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///../var/ci.db
        run: alembic upgrade head
      - name: Models and migrations agree
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///../var/ci.db
        # An autogenerate that produces operations means a model changed without
        # a migration to match it.
        run: |
          alembic revision --autogenerate -m "ci drift check" -_ 2>/dev/null || true
          if grep -rqE "op\.(create|drop|add|alter)_" alembic/versions/*ci_drift_check*.py 2>/dev/null; then
            echo "Models have drifted from the migrations. Generate one:"
            echo "  cd backend && alembic revision --autogenerate -m 'describe the change'"
            exit 1
          fi
          echo "no drift"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check and build
        run: npm run build

      - name: Tests
        run: npm test

  no-identity-documents:
    name: No real identity documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse image files under evaluation/samples
        # The rule the README states, enforced rather than trusted. Git history
        # is permanent and this repository is public: one real Aadhaar image
        # committed here is a harm to a real person that cannot be undone.
        run: |
          found=$(git ls-files 'evaluation/samples/**' \
            | grep -iE '\.(jpg|jpeg|png|webp|bmp|tiff?|pdf)$' || true)
          if [ -n "$found" ]; then
            echo "Image files are committed under evaluation/samples:"
            echo "$found"
            echo
            echo "Samples must be generated by evaluation/samples.py, not committed."
            exit 1
          fi
          echo "none found"

      - name: Refuse committed signing keys
        run: |
          found=$(git ls-files | grep -iE '(demo-signer|private).*\.pem$' || true)
          if [ -n "$found" ]; then
            echo "A signing key is committed: $found"
            exit 1
          fi
          echo "none found"
