server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: every unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The live check stream is server-sent events. Buffering it would hold
        # every result until the screening finished, which defeats the point.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    client_max_body_size 25m;
}
